<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijoz Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --gold: #C9A84C; --dark: #1A1008; --dark2: #2C1F0E; --text: #F0E6CC; }
        body { background: var(--dark); color: var(--text); font-family: sans-serif; margin: 0; padding: 15px; }
        .header { text-align: center; margin-bottom: 20px; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--dark2); border-radius: 15px; overflow: hidden; border: 1px solid #3D2B14; padding-bottom: 10px; text-align: center; }
        .card img { width: 100%; height: 110px; object-fit: cover; background: #000; }
        .add-btn { background: var(--gold); border: none; padding: 10px; width: 90%; border-radius: 10px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .cart-bar { position: fixed; bottom: 20px; left: 15px; right: 15px; background: var(--gold); color: #000; padding: 15px; border-radius: 15px; display: none; justify-content: space-between; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div class="header">
    <h1 id="uiResTitle" style="color:var(--gold); margin:0 0 10px;">Restoran</h1>
    Stol: <select id="stolNum" style="background:none; color:var(--gold); border:1px solid var(--gold); border-radius:5px;"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
</div>

<div id="uiMenuArea" class="menu-grid">
    <p style="grid-column: 1/3; text-align: center; color: var(--gold);">Menyu yuklanmoqda...</p>
</div>

<div class="cart-bar" id="cartBar" onclick="sendOrder()">
    <span>Buyurtma Berish</span>
    <span id="uiTotal">0 so'm</span>
</div>

<script>
    let peer, conn, menu = [], cart = {};

    peer = new Peer();
    peer.on('open', () => {
        conn = peer.connect('restoran-oshpaz-2024');
        conn.on('data', data => {
            if(data.type === 'settings') {
                document.getElementById('uiResTitle').innerText = data.settings.name;
                menu = data.settings.menu;
                render();
            }
        });
    });

    function render() {
        if(menu.length === 0) return;
        document.getElementById('uiMenuArea').innerHTML = menu.map(m => `
            <div class="card">
                <img src="${m.img}" onerror="this.src='https://via.placeholder.com/150?text=Ovqat'">
                <div style="padding:5px; font-weight:bold;">${m.name}</div>
                <div style="color:var(--gold); font-size:13px;">${m.price.toLocaleString()} so'm</div>
                <button class="add-btn" onclick="addToCart(${m.id})">Qo'shish</button>
            </div>`).join('');
    }

    function addToCart(id) {
        const item = menu.find(m => m.id === id);
        if(!cart[id]) cart[id] = {qty: 0, item};
        cart[id].qty++;
        updateCart();
    }

    function updateCart() {
        let total = 0;
        Object.values(cart).forEach(c => total += (c.qty * c.item.price));
        if(total > 0) {
            document.getElementById('cartBar').style.display = 'flex';
            document.getElementById('uiTotal').innerText = total.toLocaleString() + " so'm";
        }
    }

    function sendOrder() {
        let total = 0;
        const taomlar = Object.values(cart).map(c => {
            total += (c.qty * c.item.price);
            return {nom: c.item.name, miqdor: c.qty};
        });
        
        if(conn && conn.open) {
            conn.send({
                type: 'new_order', 
                order: {
                    id: Date.now(),
                    raqam: Math.floor(100 + Math.random() * 900),
                    stol: document.getElementById('stolNum').value,
                    taomlar: taomlar,
                    summa: total,
                    holat: 'yangi'
                }
            });
            alert("Buyurtma yuborildi!");
            location.reload();
        }
    }
</script>
</body>
</html>
