<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restoran – Buyurtma</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>if(typeof Peer==='undefined'){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"><\/script>');}</script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--gold-light:#E8C97A;--dark:#1A1008;--dark2:#2C1F0E;--dark3:#3D2B14;--cream:#F5EDD6;--text:#F0E6CC;--muted:#A08060;--red:#E05C3A;--green:#4CAF7C;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;background-image:radial-gradient(ellipse at 20% 0%,#3D2008 0%,transparent 60%),radial-gradient(ellipse at 80% 100%,#1F1500 0%,transparent 60%);}

/* SETUP */
#setupScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;}
.setup-logo{font-size:52px;margin-bottom:10px;}
.setup-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:6px;}
.setup-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px;}
.setup-card{background:rgba(44,31,14,0.8);border:1px solid rgba(201,168,76,0.2);border-radius:20px;padding:18px;width:100%;max-width:360px;margin-bottom:14px;}
.setup-card h3{font-size:14px;color:var(--gold);margin-bottom:12px;}
.table-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.tbl-btn{aspect-ratio:1;border-radius:12px;border:1.5px solid rgba(201,168,76,0.2);background:rgba(255,255,255,0.03);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'Playfair Display',serif;font-size:16px;color:var(--muted);transition:all .2s;}
.tbl-btn.sel{background:rgba(201,168,76,0.2);border-color:var(--gold);color:var(--cream);font-weight:700;}
.tbl-btn:active{transform:scale(.93);}
.start-btn{width:100%;max-width:360px;background:linear-gradient(135deg,var(--gold-light),var(--gold));border:none;border-radius:16px;padding:16px;font-size:16px;font-weight:700;color:var(--dark);cursor:pointer;font-family:'DM Sans',sans-serif;opacity:.4;transition:opacity .2s;}
.start-btn.ok{opacity:1;}

/* CONNECTING */
#connectingScreen{min-height:100vh;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
#connectingScreen.show{display:flex;}
.spinner{width:44px;height:44px;border:3px solid rgba(201,168,76,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.conn-txt{font-size:14px;color:var(--muted);}

/* MENU PAGE */
#menuPage{display:none;}
.header{background:linear-gradient(180deg,var(--dark2) 0%,transparent 100%);padding:20px 16px 14px;text-align:center;border-bottom:1px solid rgba(201,168,76,0.2);position:relative;}
.header-ornament{color:var(--gold);font-size:12px;letter-spacing:5px;opacity:.7;margin-bottom:4px;}
.header h1{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;background:linear-gradient(135deg,var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.conn-status{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;justify-content:center;gap:4px;}
.cdot{width:6px;height:6px;border-radius:50%;background:var(--red);display:inline-block;}
.cdot.on{background:var(--green);}
.table-badge{display:inline-block;background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.4);border-radius:20px;padding:4px 14px;font-size:12px;color:var(--gold);margin-top:8px;}
.back-btn{position:absolute;top:14px;right:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:6px 10px;font-size:11px;color:var(--muted);cursor:pointer;}

.tabs{display:flex;overflow-x:auto;gap:8px;padding:12px 14px 0;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex-shrink:0;padding:8px 15px;border-radius:24px;border:1px solid rgba(201,168,76,0.25);background:rgba(255,255,255,0.03);color:var(--muted);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .25s;}
.tab.active{background:var(--gold);color:var(--dark);border-color:var(--gold);font-weight:600;}

.sec-header{padding:16px 14px 6px;display:flex;align-items:center;gap:10px;}
.sec-header h2{font-family:'Playfair Display',serif;font-size:19px;color:var(--cream);}
.sec-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(201,168,76,0.3),transparent);}

.menu-grid{padding:0 14px 110px;display:flex;flex-direction:column;gap:10px;}
.menu-item{background:linear-gradient(135deg,rgba(44,31,14,.9),rgba(26,16,8,.9));border:1px solid rgba(201,168,76,0.15);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;position:relative;overflow:hidden;transition:border-color .2s;}
.menu-item.in-cart{border-color:rgba(201,168,76,0.5);}
.menu-item::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,0.3),transparent);}
.item-img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0;}
.item-emoji{font-size:34px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:rgba(201,168,76,0.08);border-radius:12px;flex-shrink:0;}
.item-info{flex:1;min-width:0;}
.item-name{font-family:'Playfair Display',serif;font-size:14px;color:var(--cream);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-desc{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-price{font-family:'Playfair Display',serif;font-size:13px;color:var(--gold);font-weight:700;margin-top:3px;}
.item-controls{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.qty-btn{width:28px;height:28px;border-radius:50%;border:1px solid rgba(201,168,76,0.4);background:rgba(201,168,76,0.1);color:var(--gold);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qty-btn:active{background:var(--gold);color:var(--dark);}
.qty-num{font-size:15px;font-weight:600;color:var(--cream);min-width:18px;text-align:center;}
.add-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--gold);color:var(--dark);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;}
.add-btn:active{transform:scale(.88);}

/* CART */
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#2C1F0E,#1A1008);border-top:1px solid rgba(201,168,76,0.3);padding:12px 16px;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:100;box-shadow:0 -8px 30px rgba(0,0,0,.5);}
.cart-bar.visible{transform:translateY(0);}
.cart-bar-inner{display:flex;align-items:center;gap:12px;}
.cart-info{flex:1;}
.cart-count{font-size:12px;color:var(--muted);}
.cart-total{font-family:'Playfair Display',serif;font-size:18px;color:var(--gold);font-weight:700;}
.cart-btn{background:linear-gradient(135deg,var(--gold-light),var(--gold));border:none;border-radius:14px;padding:12px 20px;font-size:14px;font-weight:700;color:var(--dark);cursor:pointer;font-family:'DM Sans',sans-serif;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(4px);}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:linear-gradient(180deg,var(--dark2),var(--dark));border-top:1px solid rgba(201,168,76,0.3);border-radius:24px 24px 0 0;width:100%;padding:20px 16px 36px;transform:translateY(40px);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:85vh;overflow-y:auto;}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-handle{width:40px;height:4px;background:rgba(201,168,76,0.3);border-radius:2px;margin:0 auto 18px;}
.modal-title{font-family:'Playfair Display',serif;font-size:20px;color:var(--cream);margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
.ord-item{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid rgba(201,168,76,0.1);gap:10px;}
.ord-img{width:32px;height:32px;border-radius:8px;object-fit:cover;}
.ord-emoji{font-size:20px;width:32px;text-align:center;}
.ord-info{flex:1;}
.ord-name{font-size:14px;color:var(--cream);}
.ord-qty{font-size:12px;color:var(--muted);}
.ord-price{font-family:'Playfair Display',serif;font-size:14px;color:var(--gold);}
.ord-divider{display:flex;justify-content:space-between;padding:12px 0 6px;border-top:1px solid rgba(201,168,76,0.2);margin-top:4px;}
.ord-total-lbl{font-size:14px;color:var(--muted);}
.ord-total{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);font-weight:700;}
.confirm-btn{width:100%;background:linear-gradient(135deg,var(--gold-light),#B8902A);border:none;border-radius:16px;padding:15px;font-size:15px;font-weight:700;color:var(--dark);cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:14px;}
.close-btn{width:100%;background:transparent;border:1px solid rgba(201,168,76,0.2);border-radius:16px;padding:12px;font-size:14px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:8px;}

/* SUCCESS */
.success-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s;}
.success-overlay.open{opacity:1;pointer-events:all;}
.success-card{background:linear-gradient(135deg,var(--dark2),var(--dark3));border:1px solid rgba(201,168,76,0.4);border-radius:24px;padding:32px 24px;text-align:center;max-width:290px;width:calc(100% - 40px);transform:scale(.85);transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.success-overlay.open .success-card{transform:scale(1);}
.success-icon{font-size:50px;margin-bottom:12px;}
.success-title{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);margin-bottom:8px;}
.success-text{font-size:13px;color:var(--muted);line-height:1.5;}
.success-num{display:inline-block;background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.3);border-radius:20px;padding:5px 16px;font-size:13px;color:var(--gold);margin:12px 0;font-weight:600;}
.new-ord-btn{background:var(--gold);border:none;border-radius:14px;padding:12px 26px;font-size:14px;font-weight:700;color:var(--dark);cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:6px;}

.send-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:none;align-items:center;justify-content:center;}
.send-overlay.open{display:flex;}

.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-70px);background:rgba(44,31,14,0.95);border:1px solid rgba(201,168,76,0.3);border-radius:12px;padding:10px 20px;font-size:13px;color:var(--cream);z-index:500;transition:transform .3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- SETUP -->
<div id="setupScreen">
  <div class="setup-logo">🍽️</div>
  <div class="setup-title" id="setupTitle">La Dolce Vita</div>
  <div class="setup-sub">Stol raqamingizni tanlang</div>
  <div class="setup-card">
    <h3>🪑 Stol tanlang</h3>
    <div class="table-grid" id="tableGrid"></div>
  </div>
  <button class="start-btn" id="startBtn" onclick="startApp()">Buyurtma qilish →</button>
</div>

<!-- CONNECTING -->
<div id="connectingScreen">
  <div class="spinner"></div>
  <div class="conn-txt">Admin ga ulanmoqda...</div>
</div>

<!-- MENU -->
<div id="menuPage">
  <div class="header">
    <div class="header-ornament">✦ ✦ ✦</div>
    <h1 id="headerTitle">La Dolce Vita</h1>
    <div class="conn-status"><span class="cdot" id="cdot"></span><span id="ctext">Ulanmoqda</span></div>
    <div class="table-badge">🍽️ Stol № <span id="tblBadge">?</span></div>
    <button class="back-btn" onclick="goBack()">↩ Stol</button>
  </div>
  <div class="tabs" id="menuTabs"></div>
  <div id="menuContainer"></div>
  <div class="cart-bar" id="cartBar">
    <div class="cart-bar-inner">
      <div style="font-size:26px">🛒</div>
      <div class="cart-info">
        <div class="cart-count"><span id="cartCount">0</span> ta mahsulot</div>
        <div class="cart-total"><span id="cartTotal">0</span> so'm</div>
      </div>
      <button class="cart-btn" onclick="openModal()">Buyurtma →</button>
    </div>
  </div>
</div>

<!-- ORDER MODAL -->
<div class="modal-overlay" id="orderModal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">🧾 Buyurtmangiz</div>
    <div class="modal-sub">Stol № <span id="modalTbl">?</span> • Tekshirib tasdiqlang</div>
    <div id="orderList"></div>
    <div class="ord-divider"><span class="ord-total-lbl">Jami:</span><span class="ord-total" id="modalTotal">0 so'm</span></div>
    <button class="confirm-btn" onclick="confirmOrder()">✅ Oshpazga yuborish</button>
    <button class="close-btn" onclick="closeModal()">Orqaga</button>
  </div>
</div>

<!-- SUCCESS -->
<div class="success-overlay" id="successOverlay">
  <div class="success-card">
    <div class="success-icon">🎉</div>
    <div class="success-title">Yuborildi!</div>
    <div class="success-text">Buyurtmangiz oshpazga yetdi!</div>
    <div class="success-num">Buyurtma #<span id="ordNum">001</span></div>
    <div class="success-text" style="font-size:12px">Kuting, tez tayyorlanadi 😊</div>
    <button class="new-ord-btn" onclick="newOrder()">Yana buyurtma</button>
  </div>
</div>

<div class="send-overlay" id="sendOverlay"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script>
const ADMIN_PEER_ID = "restoran-admin-2024";

let peer, conn;
let menu = {};
let selTable = null, cart = {}, ordCounter = Math.floor(Math.random()*900)+100;
let menuReceived = false;

// TABLE GRID
(function(){
  const g = document.getElementById('tableGrid');
  for(let i=1;i<=20;i++){
    const b = document.createElement('button');
    b.className='tbl-btn'; b.textContent=i;
    b.onclick=()=>{
      document.querySelectorAll('.tbl-btn').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel'); selTable=i;
      document.getElementById('startBtn').classList.add('ok');
    };
    g.appendChild(b);
  }
})();

function startApp(){
  if(!selTable){ showToast('Stol tanlang!'); return; }
  document.getElementById('setupScreen').style.display='none';
  document.getElementById('connectingScreen').classList.add('show');

  peer = new Peer({host:'0.peerjs.com', port:443, secure:true, path:'/'});

  peer.on('open', () => {
    conn = peer.connect(ADMIN_PEER_ID, {metadata:{type:'mijoz'}});
    conn.on('open', () => {
      setConnUI(true);
      conn.send({type:'get_menu'});
      // 4 soniyada menyu kelmasa ham ko'rsatamiz
      setTimeout(()=>{ if(!menuReceived) showMenuPage(); }, 4000);
    });
    conn.on('data', handleData);
    conn.on('close', () => setConnUI(false));
    conn.on('error', () => setConnUI(false));
  });

  peer.on('error', () => {
    showMenuPage();
    setConnUI(false);
    showToast('⚠️ Offline rejim');
  });

  // 8 soniyada timeout
  setTimeout(()=>{
    if(!menuReceived){
      showMenuPage();
      setConnUI(false);
    }
  }, 8000);
}

function showMenuPage(){
  document.getElementById('connectingScreen').classList.remove('show');
  document.getElementById('menuPage').style.display='block';
  document.getElementById('tblBadge').textContent=selTable;
  document.getElementById('modalTbl').textContent=selTable;
  buildTabs(); renderMenu('all');
}

function handleData(data){
  if(data.type === 'menu_update'){
    if(data.menu) menu = data.menu;
    if(data.restName){
      document.getElementById('headerTitle').textContent = data.restName;
      document.getElementById('setupTitle').textContent  = data.restName;
    }
    if(!menuReceived){
      menuReceived = true;
      showMenuPage();
    } else {
      // Admin o'zgartirdi — menyu yangilansin
      renderMenu('all');
      showToast('🔄 Menyu yangilandi');
    }
  }
  if(data.type === 'order_confirmed'){
    document.getElementById('ordNum').textContent = data.raqam || String(ordCounter++).padStart(3,'0');
    document.getElementById('sendOverlay').classList.remove('open');
    document.getElementById('successOverlay').classList.add('open');
  }
}

function goBack(){
  if(peer){peer.destroy();peer=null;}
  conn=null; cart={}; menuReceived=false; selTable=null;
  document.getElementById('menuPage').style.display='none';
  document.getElementById('setupScreen').style.display='flex';
  document.querySelectorAll('.tbl-btn').forEach(b=>b.classList.remove('sel'));
  document.getElementById('startBtn').classList.remove('ok');
}

function setConnUI(on){
  document.getElementById('cdot').className='cdot'+(on?' on':'');
  document.getElementById('ctext').textContent=on?'Ulangan':'Offline rejim';
}

// MENU
function buildTabs(){
  const defs=[{k:'all',l:'Barchasi',e:'🍽️'},{k:'taomlar',l:'Taomlar',e:'🥘'},{k:'sho',l:"Sho'rva",e:'🍲'},{k:'salatlar',l:'Salat',e:'🥗'},{k:'icimliklar',l:'Ichimlik',e:'🥤'},{k:'shirinliklar',l:'Shirin',e:'🍰'}];
  document.getElementById('menuTabs').innerHTML=defs.map((d,i)=>`<button class="tab ${i===0?'active':''}" onclick="showSec('${d.k}',this)">${d.e} ${d.l}</button>`).join('');
}

function renderMenu(filter){
  const c=document.getElementById('menuContainer'); c.innerHTML='';
  const keys=Object.keys(menu);
  if(!keys.length){
    c.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted)">Menyu yuklanmoqda...</div>';
    return;
  }
  const secs=filter==='all'?keys:[filter];
  secs.forEach(key=>{
    const sec=menu[key]; if(!sec||!sec.items||!sec.items.length)return;
    const h=document.createElement('div'); h.className='sec-header';
    h.innerHTML=`<h2>${sec.title}</h2><div class="sec-line"></div>`; c.appendChild(h);
    const g=document.createElement('div'); g.className='menu-grid';
    sec.items.forEach(item=>{
      const qty=cart[item.id]?cart[item.id].qty:0;
      const imgEl=item.img
        ? `<img class="item-img" src="${item.img}">`
        : `<div class="item-emoji">${item.emoji||'🍽️'}</div>`;
      const d=document.createElement('div');
      d.className=`menu-item ${qty>0?'in-cart':''}`;
      d.id=`item-${item.id}`;
      d.innerHTML=`${imgEl}
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          <div class="item-desc">${item.desc||''}</div>
          <div class="item-price">${fmt(item.price)} so'm</div>
        </div>
        <div class="item-controls" id="ctrl-${item.id}">
          ${qty>0
            ?`<button class="qty-btn" onclick="chgQty(${item.id},-1)">−</button><span class="qty-num">${qty}</span><button class="qty-btn" onclick="chgQty(${item.id},1)">+</button>`
            :`<button class="add-btn" onclick="addItem(${item.id})">+</button>`}
        </div>`;
      g.appendChild(d);
    });
    c.appendChild(g);
  });
}

function showSec(k,btn){
  document.querySelectorAll('#menuTabs .tab').forEach(t=>t.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderMenu(k);
}

function findItem(id){
  for(const k in menu){
    const f=menu[k].items&&menu[k].items.find(i=>i.id===id);
    if(f)return f;
  }
  return null;
}

function addItem(id){
  const item=findItem(id); if(!item)return;
  cart[id]={qty:1,item}; updateBar(); refreshCtrl(id);
}
function chgQty(id,d){
  if(!cart[id])return;
  cart[id].qty+=d;
  if(cart[id].qty<=0)delete cart[id];
  updateBar(); refreshCtrl(id);
}
function refreshCtrl(id){
  const qty=cart[id]?cart[id].qty:0;
  const ctrl=document.getElementById(`ctrl-${id}`);
  const el=document.getElementById(`item-${id}`);
  if(!ctrl)return;
  if(qty>0){
    ctrl.innerHTML=`<button class="qty-btn" onclick="chgQty(${id},-1)">−</button><span class="qty-num">${qty}</span><button class="qty-btn" onclick="chgQty(${id},1)">+</button>`;
    el.classList.add('in-cart');
  } else {
    ctrl.innerHTML=`<button class="add-btn" onclick="addItem(${id})">+</button>`;
    el.classList.remove('in-cart');
  }
}
function updateBar(){
  let tq=0,tp=0;
  Object.values(cart).forEach(c=>{tq+=c.qty;tp+=c.qty*c.item.price;});
  document.getElementById('cartCount').textContent=tq;
  document.getElementById('cartTotal').textContent=fmt(tp);
  document.getElementById('cartBar').classList.toggle('visible',tq>0);
}

function openModal(){
  const ids=Object.keys(cart); let html='',total=0;
  if(!ids.length){
    document.getElementById('orderList').innerHTML='<div style="text-align:center;padding:16px;color:var(--muted)">Savatcha bo\'sh!</div>';
    document.getElementById('modalTotal').textContent='0 so\'m';
  } else {
    ids.forEach(id=>{
      const{qty,item}=cart[id]; const sub=qty*item.price; total+=sub;
      const imgEl=item.img?`<img class="ord-img" src="${item.img}">`:`<span class="ord-emoji">${item.emoji||'🍽️'}</span>`;
      html+=`<div class="ord-item">${imgEl}<div class="ord-info"><div class="ord-name">${item.name}</div><div class="ord-qty">${qty} × ${fmt(item.price)} so'm</div></div><span class="ord-price">${fmt(sub)} so'm</span></div>`;
    });
    document.getElementById('orderList').innerHTML=html;
    document.getElementById('modalTotal').textContent=fmt(total)+' so\'m';
  }
  document.getElementById('orderModal').classList.add('open');
}
function closeModal(){document.getElementById('orderModal').classList.remove('open');}

async function confirmOrder(){
  const ids=Object.keys(cart); if(!ids.length)return;
  closeModal();
  document.getElementById('sendOverlay').classList.add('open');

  const taomlar=ids.map(id=>{
    const{qty,item}=cart[id];
    return{emoji:item.emoji||'🍽️', img:item.img||null, nom:item.name, miqdor:qty, narx:item.price, jami:qty*item.price};
  });
  const total=taomlar.reduce((s,t)=>s+t.jami,0);
  const raqam=String(ordCounter++).padStart(3,'0');
  const orderData={
    type:'new_order',
    order:{id:'ord_'+Date.now(), raqam, stol:selTable, taomlar, jami_summa:total, holat:'yangi', vaqt:Date.now()}
  };

  if(conn && conn.open){
    try{ conn.send(orderData); }catch(e){ fallbackSuccess(raqam); }
  } else { fallbackSuccess(raqam); }

  setTimeout(()=>{
    if(document.getElementById('sendOverlay').classList.contains('open')) fallbackSuccess(raqam);
  }, 6000);
}

function fallbackSuccess(raqam){
  document.getElementById('sendOverlay').classList.remove('open');
  document.getElementById('ordNum').textContent=raqam;
  document.getElementById('successOverlay').classList.add('open');
}

function newOrder(){
  cart={}; updateBar();
  document.getElementById('successOverlay').classList.remove('open');
  renderMenu('all');
  document.querySelectorAll('#menuTabs .tab').forEach((t,i)=>t.classList.toggle('active',i===0));
}

function fmt(p){return p.toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
