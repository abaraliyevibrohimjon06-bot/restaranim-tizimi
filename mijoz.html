<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijoz Panel</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  :root{--gold:#C9A84C;--dark:#1A1008;--dark2:#2C1F0E;--text:#F0E6CC;--border:#3D2B14;}
  body{background:var(--dark);color:var(--text);font-family:sans-serif;margin:0;padding:15px;}
  h1{color:var(--gold);text-align:center;font-size:24px;}
  .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .card{background:var(--dark2);border:1px solid var(--border);border-radius:15px;overflow:hidden;text-align:center;}
  .card img{width:100%;height:100px;object-fit:cover;background:#000;}
  .add-btn{background:var(--gold);border:none;padding:8px 0;width:90%;margin:10px auto;border-radius:8px;font-weight:700;display:block;}
  .footer-btn{position:fixed;bottom:20px;left:15px;right:15px;background:var(--gold);color:#000;padding:15px;border-radius:15px;display:none;justify-content:space-between;font-weight:700;}
</style>
</head>
<body>
<h1 id="resTitle">Yuklanmoqda...</h1>
<div style="text-align:center;margin-bottom:15px">Stol: <select id="stolId" style="background:none;color:var(--gold);border:1px solid var(--gold);"><option>1</option><option>2</option><option>3</option></select></div>
<div class="menu-grid" id="menuArea"></div>
<div class="footer-btn" id="cartBtn" onclick="send()"><span>Buyurtma berish</span><span id="totalUI">0</span></div>

<script>
let peer, conn, menu = [], cart = {};
peer = new Peer();
peer.on('open', () => {
  conn = peer.connect('restoran-oshpaz-2024');
  conn.on('data', data => {
    if(data.type==='settings'){
      document.getElementById('resTitle').innerText = data.settings.name;
      menu = data.settings.menu; render();
    }
  });
});

function render(){
  document.getElementById('menuArea').innerHTML = menu.map(m => `
    <div class="card">
      <img src="${m.img}" onerror="this.style.display='none'">
      <div style="padding:10px">
        <div style="font-size:14px;font-weight:700">${m.name}</div>
        <div style="color:var(--gold);font-size:12px">${m.price.toLocaleString()} so'm</div>
      </div>
      <button class="add-btn" onclick="add(${m.id})">Qo'shish +</button>
    </div>`).join('');
}

function add(id){
  const item = menu.find(m=>m.id===id);
  if(!cart[id]) cart[id]={qty:0, item};
  cart[id].qty++;
  let total=0; Object.values(cart).forEach(c=>total+=(c.qty*c.item.price));
  document.getElementById('cartBtn').style.display='flex';
  document.getElementById('totalUI').innerText = total.toLocaleString() + " so'm";
}

function send(){
  const taomlar = Object.values(cart).map(c=>({nom:c.item.name, miqdor:c.qty, img:c.item.img}));
  let total=0; Object.values(cart).forEach(c=>total+=(c.qty*c.item.price));
  const order = { id:'ord_'+Date.now(), raqam:Math.floor(Math.random()*900), stol:document.getElementById('stolId').value, taomlar, jami_summa:total, holat:'yangi' };
  conn.send({type:'new_order', order});
  alert("Yuborildi!"); location.reload();
}
</script>
</body>
</html>
