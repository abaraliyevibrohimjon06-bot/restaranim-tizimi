<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oshpaz Panel</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--gold:#C9A84C;--dark:#0D1117;--dark2:#161B22;--green:#2EA043;--blue:#388BFD;--text:#E6EDF3;--border:#30363D;}
  body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;margin:0;}
  .top-bar{background:var(--dark2);border-bottom:1px solid var(--border);padding:15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;}
  .res-name{color:var(--gold);font-family:'Playfair Display',serif;cursor:pointer;}
  .total-row{background:var(--dark2);padding:15px;border-bottom:2px solid var(--gold);text-align:center;font-size:18px;font-weight:700;}
  .order-card{background:var(--dark2);border:1px solid var(--border);margin:10px;border-radius:12px;padding:12px;}
  .item-img{width:40px;height:40px;border-radius:5px;object-fit:cover;margin-right:10px;}
  .admin-panel{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--dark);display:none;padding:20px;overflow-y:auto;z-index:100;}
  .input-group{margin-bottom:15px;background:var(--dark2);padding:10px;border-radius:10px;}
  input{width:100%;padding:10px;margin-top:5px;background:#000;border:1px solid var(--border);color:#fff;border-radius:5px;}
  .btn{padding:10px;border:none;border-radius:5px;cursor:pointer;font-weight:700;width:100%;margin-top:10px;}
</style>
</head>
<body>

<div class="top-bar">
  <div class="res-name" onclick="openAdmin()">👨‍🍳 <span id="uiResName">Restoran Panel</span></div>
  <div id="status" style="font-size:10px;color:gray">Ulanmoqda...</div>
</div>

<div class="total-row">Jami tushgan mablag': <span id="uiTotalSum" style="color:var(--gold)">0</span> so'm</div>

<div id="ordersArea"></div>

<div id="adminArea" class="admin-panel">
  <h2 style="color:var(--gold)">Boshqaruv Paneli</h2>
  <div class="input-group">
    <label>Restoran nomi:</label>
    <input type="text" id="inResName">
  </div>
  <div id="menuEditList"></div>
  <button class="btn" style="background:var(--green);color:#fff" onclick="saveSettings()">Saqlash va Yangilash</button>
  <button class="btn" style="background:var(--blue);color:#fff" onclick="closeAdmin()">Yopish</button>
</div>

<script>
let peer, orders = {}, totalCash = 0;
let settings = JSON.parse(localStorage.getItem('restSettings')) || {
  name: "Mening Restaranim",
  menu: [
    {id:1, name:"Osh", price:35000, img:''},
    {id:2, name:"Manti", price:30000, img:''}
  ]
};

function init(){
  document.getElementById('uiResName').innerText = settings.name;
  peer = new Peer('restoran-oshpaz-2024');
  peer.on('open', () => document.getElementById('status').innerText = "🟢 Online");
  peer.on('connection', conn => {
    conn.on('open', () => conn.send({type:'settings', settings}));
    conn.on('data', data => {
      if(data.type==='new_order'){ orders[data.order.id]=data.order; renderOrders(); }
    });
  });
}

function renderOrders(){
  document.getElementById('ordersArea').innerHTML = Object.values(orders).reverse().map(o => `
    <div class="order-card">
      <div style="display:flex;justify-content:space-between"><b>Stol ${o.stol}</b> <span>#${o.raqam}</span></div>
      ${o.taomlar.map(t => `<div style="display:flex;align-items:center;margin:5px 0"><img src="${t.img}" class="item-img" onerror="this.hidden=true"><span>${t.nom} x${t.miqdor}</span></div>`).join('')}
      <div style="margin-top:10px;color:var(--gold)">Summa: ${o.jami_summa.toLocaleString()} so'm</div>
      ${o.holat==='yangi' ? `<button class="btn" style="background:var(--blue);color:#fff" onclick="complete('${o.id}')">Tayyor</button>` : ''}
    </div>`).join('');
}

function complete(id){
  totalCash += orders[id].jami_summa;
  orders[id].holat = 'tayyor';
  document.getElementById('uiTotalSum').innerText = totalCash.toLocaleString();
  renderOrders();
}

function openAdmin(){
  if(prompt("Parol:")==='777'){
    document.getElementById('adminArea').style.display='block';
    document.getElementById('inResName').value = settings.name;
    const list = document.getElementById('menuEditList');
    list.innerHTML = settings.menu.map((m,i)=>`
      <div class="input-group">
        <input type="text" value="${m.name}" onchange="settings.menu[${i}].name=this.value" placeholder="Taom nomi">
        <input type="number" value="${m.price}" onchange="settings.menu[${i}].price=Number(this.value)" placeholder="Narxi">
        <label style="font-size:12px;margin-top:5px;display:block">Rasm yuklash:</label>
        <input type="file" accept="image/*" onchange="handleImg(event, ${i})">
      </div>`).join('');
  }
}

function handleImg(e, idx){
  const reader = new FileReader();
  reader.onload = function(){ settings.menu[idx].img = reader.result; };
  reader.readAsDataURL(e.target.files[0]);
}

function saveSettings(){
  settings.name = document.getElementById('inResName').value;
  localStorage.setItem('restSettings', JSON.stringify(settings));
  location.reload();
}
function closeAdmin(){ document.getElementById('adminArea').style.display='none'; }
init();
</script>
</body>
</html>
