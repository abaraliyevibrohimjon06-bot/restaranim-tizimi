<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oshpaz Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --gold: #C9A84C; --dark: #0D1117; --dark2: #161B22; --border: #30363D; --text: #E6EDF3; }
        body { background: var(--dark); color: var(--text); font-family: sans-serif; margin: 0; }
        .top-bar { background: var(--dark2); padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .cash-row { background: var(--dark2); padding: 15px; border-bottom: 2px solid var(--gold); text-align: center; font-size: 18px; font-weight: bold; }
        .order-card { background: var(--dark2); border: 1px solid var(--border); margin: 10px; border-radius: 12px; padding: 15px; }
        .admin-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); display: none; padding: 20px; overflow-y: auto; z-index: 100; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 10px; color: #fff; }
    </style>
</head>
<body>

<div class="top-bar">
    <b style="color:var(--gold); font-size: 20px;" id="uiResName">Restoran</b>
    <button onclick="openAdmin()" style="background:none; border:1px solid var(--gold); color:var(--gold); padding:5px 10px; border-radius:5px;">Admin</button>
</div>

<div class="cash-row">Jami tushgan: <span id="uiTotalCash" style="color:var(--gold)">0</span> so'm</div>
<div id="ordersArea"></div>

<div id="adminPanel" class="admin-panel">
    <h2 style="color:var(--gold)">⚙️ Sozlamalar (Parol: 777)</h2>
    <label>Restoran nomi:</label>
    <input type="text" id="inResName">
    <div id="menuEditArea"></div>
    <button class="btn" style="background:#2EA043" onclick="saveAdmin()">Saqlash</button>
    <button class="btn" style="background:#F85149" onclick="document.getElementById('adminPanel').style.display='none'">Yopish</button>
</div>

<script>
    let peer, orders = {}, totalCash = 0;
    let settings = JSON.parse(localStorage.getItem('resConfig_v3')) || {
        name: "Mening Restoranom",
        menu: [
            {id:1, name:"Osh", price:35000, img:"https://img.freepik.com/free-photo/uzbek-pilaf-with-lamb-meat_140725-3453.jpg"},
            {id:2, name:"Manti", price:30000, img:"https://i.ytimg.com/vi/W4rR38pX7lI/maxresdefault.jpg"}
        ]
    };

    function start() {
        document.getElementById('uiResName').innerText = settings.name;
        peer = new Peer('restoran-oshpaz-2024');
        peer.on('connection', conn => {
            conn.on('open', () => conn.send({type:'settings', settings}));
            conn.on('data', data => {
                if(data.type==='new_order') { orders[data.order.id]=data.order; drawOrders(); }
            });
        });
    }

    function drawOrders() {
        document.getElementById('ordersArea').innerHTML = Object.values(orders).reverse().map(o => `
            <div class="order-card">
                <b>Stol ${o.stol} (#${o.raqam})</b><hr style="opacity:0.1; margin:10px 0;">
                ${o.taomlar.map(t => `<div style="margin:5px 0">${t.nom} x${t.miqdor}</div>`).join('')}
                <div style="color:var(--gold); margin-top:10px; font-weight:bold;">Jami: ${o.summa.toLocaleString()} so'm</div>
                ${o.holat==='yangi' ? `<button class="btn" style="background:#388BFD" onclick="finish('${o.id}')">Tayyor ✅</button>` : ''}
            </div>`).join('');
    }

    function finish(id) {
        totalCash += orders[id].summa;
        orders[id].holat = 'tayyor';
        document.getElementById('uiTotalCash').innerText = totalCash.toLocaleString();
        drawOrders();
    }

    function openAdmin() {
        if(prompt("Admin paroli:") === "777") {
            document.getElementById('adminPanel').style.display='block';
            document.getElementById('inResName').value = settings.name;
            document.getElementById('menuEditArea').innerHTML = settings.menu.map((m,i) => `
                <div style="background:var(--dark2); padding:10px; margin-bottom:10px; border-radius:10px; border:1px solid var(--border);">
                    <input type="text" value="${m.name}" onchange="settings.menu[${i}].name=this.value" placeholder="Taom nomi">
                    <input type="number" value="${m.price}" onchange="settings.menu[${i}].price=Number(this.value)" placeholder="Narxi">
                    <input type="text" value="${m.img}" onchange="settings.menu[${i}].img=this.value" placeholder="Rasm linki">
                </div>`).join('');
        }
    }

    function saveAdmin() {
        settings.name = document.getElementById('inResName').value;
        localStorage.setItem('resConfig_v3', JSON.stringify(settings));
        location.reload();
    }
    start();
</script>
</body>
</html>
