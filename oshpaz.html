<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oshpaz Panel</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--gold:#C9A84C;--dark:#0D1117;--dark2:#161B22;--dark3:#1C2128;--green:#2EA043;--red:#F85149;--blue:#388BFD;--text:#E6EDF3;--muted:#7D8590;--border:#30363D;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;}
  .top-bar{background:var(--dark2);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;}
  .top-bar-title{font-family:'Playfair Display',serif;font-size:18px;color:var(--gold);flex:1;cursor:pointer;}
  .stats-bar{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;}
  .stat-card{background:var(--dark2);border:1px solid var(--border);border-radius:14px;padding:10px;text-align:center;min-width:100px;flex:1;}
  .order-card{background:var(--dark2);border:1px solid var(--border);border-radius:16px;margin:12px 14px;overflow:hidden;}
  .card-header{padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;}
  .item-row{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(48,54,61,0.5);}
  .item-img{width:40px;height:40px;border-radius:8px;object-fit:cover;margin-right:10px;}
  #adminPanel{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--dark);z-index:100;display:none;padding:20px;overflow-y:auto;}
  .admin-input{width:100%;background:var(--dark3);border:1px solid var(--border);color:#fff;padding:10px;margin:5px 0;border-radius:8px;}
  .action-btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-top:10px;}
</style>
</head>
<body>
<div id="mainScreen">
  <div class="top-bar">
    <div class="top-bar-title" onclick="openAdmin()">👨‍🍳 <span id="resNameUI">Oshpaz</span></div>
    <div id="connStatus" style="font-size:10px;color:var(--muted)">Ulanmoqda...</div>
  </div>
  <div class="stats-bar">
    <div class="stat-card"><div style="color:var(--gold)" id="totalSum">0</div><div style="font-size:10px">Savdo</div></div>
    <div class="stat-card"><div id="totalOrders">0</div><div style="font-size:10px">Tayyor</div></div>
  </div>
  <div id="ordersContainer"></div>
</div>
<div id="adminPanel">
  <h2 style="color:var(--gold)">⚙️ Admin</h2>
  <label>Restoran nomi:</label><input id="resNameInput" class="admin-input">
  <div id="menuEditArea"></div>
  <button class="action-btn" style="background:var(--green);color:#fff" onclick="saveAdmin()">Saqlash</button>
  <button class="action-btn" style="background:var(--red);color:#fff" onclick="closeAdmin()">Yopish</button>
</div>
<script>
let peer, orders = {}, stats = {sum:0, count:0};
let settings = { name: "Mening Restoranom", menu: [
  {id:1, name:"Osh", price:35000, img:"https://img.freepik.com/free-photo/uzbek-pilaf-with-lamb-meat_140725-3453.jpg"},
  {id:2, name:"Manti", price:30000, img:"https://i.ytimg.com/vi/W4rR38pX7lI/maxresdefault.jpg"}
]};

peer = new Peer('restoran-oshpaz-2024');
peer.on('open', id => { document.getElementById('connStatus').innerText = "🟢 Online"; });
peer.on('connection', conn => {
  conn.on('data', data => {
    if(data.type==='new_order'){ orders[data.order.id]=data.order; renderOrders(); playBeep(); }
  });
  conn.on('open', () => conn.send({type:'settings', settings}));
});

function renderOrders(){
  const container = document.getElementById('ordersContainer');
  container.innerHTML = Object.values(orders).reverse().map(o => `
    <div class="order-card">
      <div class="card-header"><b>Stol ${o.stol}</b> <span>#${o.raqam}</span></div>
      ${o.taomlar.map(t => `<div class="item-row"><img src="${t.img}" class="item-img"><span>${t.nom} x${t.miqdor}</span></div>`).join('')}
      <div style="padding:12px">
        <div style="color:var(--gold)">Jami: ${o.jami_summa.toLocaleString()} so'm</div>
        ${o.holat==='yangi' ? `<button class="action-btn" style="background:var(--blue);color:#fff" onclick="finish('${o.id}')">Tayyor</button>` : ''}
      </div>
    </div>
  `).join('');
}
function finish(id){
  stats.sum += orders[id].jami_summa; stats.count++;
  orders[id].holat = 'tayyor';
  document.getElementById('totalSum').innerText = stats.sum.toLocaleString();
  document.getElementById('totalOrders').innerText = stats.count;
  renderOrders();
}
function openAdmin(){ if(prompt("Admin parol:")==='777'){ document.getElementById('adminPanel').style.display='block'; renderAdminMenu(); }}
function closeAdmin(){ document.getElementById('adminPanel').style.display='none'; }
function renderAdminMenu(){
  document.getElementById('resNameInput').value = settings.name;
  document.getElementById('menuEditArea').innerHTML = settings.menu.map((m,i) => `
    <div style="background:var(--dark2);padding:10px;margin-top:10px;border-radius:10px">
      <input class="admin-input" value="${m.name}" onchange="settings.menu[${i}].name=this.value">
      <input class="admin-input" value="${m.img}" onchange="settings.menu[${i}].img=this.value">
    </div>`).join('');
}
function saveAdmin(){ settings.name = document.getElementById('resNameInput').value; document.getElementById('resNameUI').innerText=settings.name; closeAdmin(); }
function playBeep(){ try{ new Audio('https://www.soundjay.com/buttons/beep-01a.mp3').play(); }catch(e){} }
</script>
</body>
</html>
