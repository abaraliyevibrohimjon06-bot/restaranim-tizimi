<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oshpaz Panel</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>if(typeof Peer==='undefined'){document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"><\/script>');}</script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--dark:#0D1117;--dark2:#161B22;--dark3:#1C2128;--green:#2EA043;--gl:#3FB950;--red:#F85149;--yellow:#D29922;--blue:#388BFD;--text:#E6EDF3;--muted:#7D8590;--border:#30363D;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.lcard{background:var(--dark2);border:1px solid var(--border);border-radius:20px;padding:30px 24px;width:100%;max-width:320px;text-align:center;}
.licon{font-size:48px;margin-bottom:12px;}
.ltitle{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);margin-bottom:4px;}
.lsub{font-size:13px;color:var(--muted);margin-bottom:20px;}
.linput{width:100%;background:var(--dark3);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:18px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;text-align:center;letter-spacing:6px;margin-bottom:10px;}
.linput:focus{border-color:var(--gl);}
.lbtn{width:100%;background:var(--green);border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;font-family:'DM Sans',sans-serif;}
.lerr{font-size:12px;color:var(--red);margin-top:6px;min-height:16px;}

/* MAIN */
#mainScreen{display:none;min-height:100vh;}
.topbar{background:var(--dark2);border-bottom:1px solid var(--border);padding:12px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:50;}
.topbar-title{font-family:'Playfair Display',serif;font-size:17px;color:var(--gold);flex:1;}
.conn-badge{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);background:var(--dark3);border:1px solid var(--border);border-radius:20px;padding:4px 10px;}
.cdot{width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0;}
.cdot.on{background:var(--gl);box-shadow:0 0 5px var(--gl);}
.icon-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;color:var(--muted);}

/* STATS */
.stats-bar{display:flex;gap:8px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;}
.stats-bar::-webkit-scrollbar{display:none;}
.scard{flex-shrink:0;background:var(--dark2);border:1px solid var(--border);border-radius:12px;padding:8px 14px;text-align:center;min-width:70px;}
.snum{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;}
.slbl{font-size:10px;color:var(--muted);margin-top:1px;}

/* FILTER */
.ftabs{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none;}
.ftabs::-webkit-scrollbar{display:none;}
.ftab{flex-shrink:0;padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:var(--dark3);color:var(--muted);font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;}
.ftab.active{background:var(--green);color:#fff;border-color:var(--green);font-weight:600;}

/* ORDERS */
.orders-list{padding:0 14px 100px;display:flex;flex-direction:column;gap:10px;}
.ocard{background:var(--dark2);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.ocard.new-ord{border-color:var(--yellow);animation:pulse 1.5s ease-in-out 4;}
.ocard.done{border-color:var(--green);opacity:.6;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(210,153,34,0);}50%{box-shadow:0 0 0 7px rgba(210,153,34,0.25);}}
.ohead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);}
.otable{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;}
.onum{font-size:11px;color:var(--muted);flex:1;}
.otime{font-size:11px;color:var(--muted);}
.sbadge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid;}
.sbadge.yangi{background:rgba(210,153,34,0.15);border-color:var(--yellow);color:var(--yellow);}
.sbadge.tayyorlanmoqda{background:rgba(56,139,253,0.15);border-color:var(--blue);color:var(--blue);}
.sbadge.tayyor{background:rgba(46,160,67,0.15);border-color:var(--gl);color:var(--gl);}
.oitems{padding:8px 12px;}
.orow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(48,54,61,0.4);}
.orow:last-child{border-bottom:none;}
.oimg{width:28px;height:28px;border-radius:6px;object-fit:cover;flex-shrink:0;}
.oemoji{font-size:18px;width:28px;text-align:center;flex-shrink:0;}
.oname{flex:1;font-size:13px;}
.oqty{font-size:12px;color:var(--muted);background:var(--dark3);border-radius:6px;padding:2px 7px;}
.ofoot{padding:8px 12px;background:rgba(0,0,0,0.2);display:flex;align-items:center;gap:8px;}
.ototal{font-size:13px;color:var(--muted);flex:1;}
.ototal span{color:var(--gold);font-weight:600;}
.abtn{padding:7px 12px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;}
.abtn-start{background:var(--blue);color:#fff;}
.abtn-done{background:var(--green);color:#fff;}
.abtn-undo{background:var(--dark3);color:var(--muted);border:1px solid var(--border);}

.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty div{font-size:44px;margin-bottom:12px;}

.nalert{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--yellow);color:#000;border-radius:14px;padding:12px 22px;font-size:14px;font-weight:700;z-index:99;transition:transform .4s;white-space:nowrap;box-shadow:0 4px 20px rgba(210,153,34,0.5);}
.nalert.show{transform:translateX(-50%) translateY(0);}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-70px);background:var(--dark3);border:1px solid var(--border);border-radius:12px;padding:10px 18px;font-size:13px;color:var(--text);z-index:200;transition:transform .3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="lcard">
    <div class="licon">👨‍🍳</div>
    <div class="ltitle">Oshpaz Panel</div>
    <div class="lsub">Parolni kiriting</div>
    <input class="linput" type="password" id="passInput" placeholder="••••" maxlength="10">
    <button class="lbtn" onclick="doLogin()">Kirish</button>
    <div class="lerr" id="loginErr"></div>
  </div>
</div>

<!-- MAIN -->
<div id="mainScreen">
  <div class="topbar">
    <div class="topbar-title">👨‍🍳 Oshpaz Panel</div>
    <button class="icon-btn" id="soundBtn" onclick="toggleSound()">🔔</button>
    <div class="conn-badge"><div class="cdot" id="connDot"></div><span id="connText">Ulanmoqda</span></div>
    <button class="icon-btn" onclick="doLogout()">⏻</button>
  </div>

  <div class="stats-bar">
    <div class="scard"><div class="snum" style="color:var(--yellow)" id="sNew">0</div><div class="slbl">Yangi</div></div>
    <div class="scard"><div class="snum" style="color:var(--blue)" id="sCook">0</div><div class="slbl">Pishirilmoqda</div></div>
    <div class="scard"><div class="snum" style="color:var(--gl)" id="sDone">0</div><div class="slbl">Tayyor</div></div>
    <div class="scard"><div class="snum" id="sAll">0</div><div class="slbl">Jami</div></div>
  </div>

  <div class="ftabs">
    <button class="ftab active" onclick="setFilter('all',this)">Barchasi</button>
    <button class="ftab" onclick="setFilter('yangi',this)">🔴 Yangi</button>
    <button class="ftab" onclick="setFilter('tayyorlanmoqda',this)">🔵 Pishirilmoqda</button>
    <button class="ftab" onclick="setFilter('tayyor',this)">✅ Tayyor</button>
  </div>

  <div class="orders-list" id="ordersList">
    <div class="empty"><div>🍽️</div><p>Hali buyurtma yo'q</p></div>
  </div>
</div>

<div class="nalert" id="nalert">🔔 Yangi buyurtma!</div>
<div class="toast" id="toast"></div>

<script>
const CHEF_PASS = "5678";
const ADMIN_PEER_ID = "restoran-admin-2024";

let peer, conn;
let orders = {};
let currentFilter = 'all';
let soundOn = true;

function doLogin(){
  if(document.getElementById('passInput').value === CHEF_PASS){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainScreen').style.display = 'block';
    initPeer();
  } else {
    document.getElementById('loginErr').textContent = '❌ Noto\'g\'ri parol!';
    document.getElementById('passInput').value = '';
  }
}

function doLogout(){
  if(peer){ peer.destroy(); peer=null; } conn=null; orders={};
  document.getElementById('mainScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('passInput').value = '';
}

function initPeer(){
  peer = new Peer({host:'0.peerjs.com', port:443, secure:true, path:'/'});
  peer.on('open', () => {
    connectToAdmin();
  });
  peer.on('error', () => {
    setConn(false, 'Xato');
    setTimeout(connectToAdmin, 5000);
  });
}

function connectToAdmin(){
  conn = peer.connect(ADMIN_PEER_ID, {metadata:{type:'oshpaz'}});
  conn.on('open', () => {
    setConn(true, 'Admin bilan ulangan ✓');
    showToast('✅ Admin ga ulandi');
  });
  conn.on('data', handleData);
  conn.on('close', () => {
    setConn(false, 'Uzildi — qayta ulanmoqda...');
    setTimeout(connectToAdmin, 4000);
  });
  conn.on('error', () => {
    setConn(false, 'Xato');
    setTimeout(connectToAdmin, 5000);
  });
}

function handleData(data){
  if(data.type === 'new_order'){
    const o = data.order;
    orders[o.id] = o;
    onNewOrder(o);
    renderOrders();
    // Tasdiqlash adminга qaytarish
    if(conn && conn.open) conn.send({type:'order_confirmed', orderId:o.id, raqam:o.raqam});
  }
  if(data.type === 'order_status'){
    if(orders[data.id]) orders[data.id].holat = data.holat;
    renderOrders();
  }
}

function updateStatus(id, holat){
  if(!orders[id]) return;
  orders[id].holat = holat;
  renderOrders();
  // Adminga xabar berish
  if(conn && conn.open) conn.send({type:'order_status', id, holat});
  showToast('✅ ' + {yangi:'Yangi',tayyorlanmoqda:'Pishirilmoqda',tayyor:'Tayyor'}[holat]);
}

function onNewOrder(o){
  if(soundOn) playBeep();
  const a = document.getElementById('nalert');
  a.textContent = `🔔 Stol ${o.stol} — Yangi buyurtma!`;
  a.classList.add('show');
  setTimeout(()=>a.classList.remove('show'), 4000);
}

function playBeep(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [0,200,400].forEach(d=>setTimeout(()=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=880;
      g.gain.setValueAtTime(0.4,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.3);
      o.start();o.stop(ctx.currentTime+0.3);
    },d));
  }catch(e){}
}

function toggleSound(){
  soundOn=!soundOn;
  document.getElementById('soundBtn').textContent=soundOn?'🔔':'🔕';
  showToast(soundOn?'🔔 Ovoz yoqildi':'🔕 Ovoz o\'chirildi');
}

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.ftab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
}

function fmt(p){return p.toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");}
function timeSince(ts){
  if(!ts)return'';
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return s+'s oldin';
  if(s<3600)return Math.floor(s/60)+'d oldin';
  return Math.floor(s/3600)+'s oldin';
}

function renderOrders(){
  const all=Object.values(orders).sort((a,b)=>(b.vaqt||0)-(a.vaqt||0));
  const filtered=currentFilter==='all'?all:all.filter(o=>o.holat===currentFilter);
  document.getElementById('sNew').textContent=all.filter(o=>o.holat==='yangi').length;
  document.getElementById('sCook').textContent=all.filter(o=>o.holat==='tayyorlanmoqda').length;
  document.getElementById('sDone').textContent=all.filter(o=>o.holat==='tayyor').length;
  document.getElementById('sAll').textContent=all.length;

  const c=document.getElementById('ordersList');
  if(!filtered.length){c.innerHTML=`<div class="empty"><div>${currentFilter==='yangi'?'✅':'🍽️'}</div><p>Hali buyurtma yo'q</p></div>`;return;}

  c.innerHTML=filtered.map(o=>{
    const slbl={yangi:'Yangi',tayyorlanmoqda:'Pishirilmoqda',tayyor:'Tayyor'}[o.holat]||o.holat;
    const items=(o.taomlar||[]).map(t=>{
      const imgEl=t.img?`<img class="oimg" src="${t.img}">`:`<span class="oemoji">${t.emoji||'🍽️'}</span>`;
      return`<div class="orow">${imgEl}<span class="oname">${t.nom}</span><span class="oqty">×${t.miqdor}</span></div>`;
    }).join('');
    let btn='';
    if(o.holat==='yangi') btn=`<button class="abtn abtn-start" onclick="updateStatus('${o.id}','tayyorlanmoqda')">🔵 Boshladim</button>`;
    else if(o.holat==='tayyorlanmoqda') btn=`<button class="abtn abtn-done" onclick="updateStatus('${o.id}','tayyor')">✅ Tayyor</button> <button class="abtn abtn-undo" onclick="updateStatus('${o.id}','yangi')">↩</button>`;
    else btn=`<button class="abtn abtn-undo" onclick="updateStatus('${o.id}','tayyorlanmoqda')">↩</button>`;

    return`<div class="ocard ${o.holat==='yangi'?'new-ord':''} ${o.holat==='tayyor'?'done':''}">
      <div class="ohead"><div><div class="otable">🍽️ Stol ${o.stol}</div><div class="onum">#${o.raqam}</div></div><div style="flex:1"></div><div class="otime">${timeSince(o.vaqt)}</div><div class="sbadge ${o.holat}">${slbl}</div></div>
      <div class="oitems">${items}</div>
      <div class="ofoot"><div class="ototal">Jami: <span>${fmt(o.jami_summa||0)} so'm</span></div>${btn}</div>
    </div>`;
  }).join('');
}

function setConn(on,txt){
  document.getElementById('connDot').className='cdot'+(on?' on':'');
  document.getElementById('connText').textContent=txt;
}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);
}

setInterval(()=>{if(Object.keys(orders).length)renderOrders();},30000);
document.getElementById('passInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
</html>
