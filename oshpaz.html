<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oshpaz va Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--gold:#C9A84C;--dark:#0D1117;--dark2:#161B22;--dark3:#1C2128;--green:#2EA043;--red:#F85149;--blue:#388BFD;--text:#E6EDF3;--muted:#7D8590;--border:#30363D;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;}
  .screen{display:none; padding-bottom: 50px;}
  .screen.active{display:block;}
  
  /* Login */
  #loginScreen{height:100vh; display:flex; align-items:center; justify-content:center;}
  .login-card{background:var(--dark2); border:1px solid var(--border); border-radius:20px; padding:30px; width:320px; text-align:center;}
  .login-input{width:100%; background:var(--dark3); border:1px solid var(--border); border-radius:10px; padding:12px; color:#fff; margin:15px 0; text-align:center; font-size:18px;}
  .login-btn{width:100%; background:var(--green); border:none; padding:12px; border-radius:10px; color:#fff; font-weight:700; cursor:pointer;}

  /* Top Bar */
  .top-bar{background:var(--dark2); border-bottom:1px solid var(--border); padding:15px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:100;}
  .top-bar-title{font-family:'Playfair Display',serif; color:var(--gold); flex:1; cursor:pointer;}
  
  /* Stats */
  .stats-grid{display:grid; grid-template-columns: 1fr 1fr; gap:10px; padding:15px;}
  .stat-item{background:var(--dark2); border:1px solid var(--border); padding:15px; border-radius:15px; text-align:center;}
  .stat-val{font-size:20px; font-weight:700; color:var(--gold);}
  .stat-lbl{font-size:12px; color:var(--muted);}

  /* Admin Modal */
  #adminPanel{position:fixed; top:0; left:0; width:100%; height:100%; background:var(--dark); z-index:200; display:none; padding:20px; overflow-y:auto;}
  .admin-item{background:var(--dark2); border:1px solid var(--border); padding:15px; border-radius:15px; margin-bottom:10px;}
  .admin-input{width:100%; background:var(--dark3); border:1px solid var(--border); color:#fff; padding:8px; border-radius:5px; margin-top:5px;}
  
  /* Orders */
  .orders-container{padding:0 15px;}
  .order-card{background:var(--dark2); border:1px solid var(--border); border-radius:15px; margin-bottom:15px; padding:15px;}
  .card-header{display:flex; justify-content:space-between; margin-bottom:10px; border-bottom:1px solid var(--border); padding-bottom:5px;}
  .item-row{display:flex; justify-content:space-between; font-size:14px; margin-bottom:4px;}
  .action-btn{width:100%; padding:10px; border-radius:10px; border:none; margin-top:10px; cursor:pointer; font-weight:700;}
  .btn-blue{background:var(--blue); color:#fff;}
  .btn-green{background:var(--green); color:#fff;}
  
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--dark3); padding:10px 20px; border-radius:20px; display:none;}
</style>
</head>
<body>

<div id="loginScreen" class="active">
  <div class="login-card">
    <h2>👨‍🍳 Oshpaz</h2>
    <input type="password" id="passInput" class="login-input" placeholder="Parol">
    <button class="login-btn" onclick="doLogin()">Kirish</button>
  </div>
</div>

<div id="mainScreen" class="screen">
  <div class="top-bar">
    <h2 class="top-bar-title" onclick="openAdmin()" id="restoranNomiUI">Mening Restoranom</h2>
    <div id="connStatus" style="font-size:10px; color:var(--muted);">Ulanmoqda...</div>
    <button onclick="location.reload()" style="background:none; border:none; color:var(--muted)">🔄</button>
  </div>

  <div class="stats-grid">
    <div class="stat-item"><div class="stat-val" id="totalSum">0</div><div class="stat-lbl">Jami Savdo (so'm)</div></div>
    <div class="stat-item"><div class="stat-val" id="totalOrders">0</div><div class="stat-lbl">Tayyor Buyurtmalar</div></div>
  </div>

  <div class="orders-container" id="ordersList"></div>
</div>

<div id="adminPanel">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="color:var(--gold)">⚙️ Admin Sozlamalari</h2>
    <button onclick="closeAdmin()" style="padding:5px 15px; border-radius:10px; background:var(--red); color:#fff; border:none;">X</button>
  </div>
  
  <div class="admin-item">
    <label>Restoran Nomi:</label>
    <input type="text" id="setRestName" class="admin-input" onchange="updateSettings()">
  </div>

  <div id="menuEditList"></div>
  <button class="login-btn" style="margin-top:20px;" onclick="saveAndBroadcast()">Saqlash va Mijozlarga yuborish</button>
</div>

<div class="toast" id="toast"></div>

<script>
let peer, conn, orders = {}, stats = {sum:0, count:0};
let settings = {
  name: "Mening Restoranom",
  menu: [
    {id:1, name:"Osh", price:35000, img:"https://img.freepik.com/free-photo/uzbek-pilaf-with-lamb-meat_140725-3453.jpg"},
    {id:2, name:"Manti", price:30000, img:"https://i.ytimg.com/vi/W4rR38pX7lI/maxresdefault.jpg"}
  ]
};

function doLogin(){
  if(document.getElementById('passInput').value === "5678"){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('mainScreen').classList.add('active');
    initPeer();
  } else { alert("Xato parol!"); }
}

function initPeer(){
  peer = new Peer('restoran-oshpaz-2024');
  peer.on('open', id => {
    document.getElementById('connStatus').innerHTML = "🟢 Online ID: " + id;
    renderMenuEdit();
  });
  peer.on('connection', c => {
    conn = c;
    c.on('data', data => {
      if(data.type === 'new_order'){
        orders[data.order.id] = data.order;
        playAlert();
        renderOrders();
      }
    });
    c.on('open', () => c.send({type:'settings', settings}));
  });
}

function renderOrders(){
  const list = document.getElementById('ordersList');
  list.innerHTML = Object.values(orders).reverse().map(o => `
    <div class="order-card" style="border-left: 5px solid ${o.holat==='yangi'?'var(--blue)':'var(--green)'}">
      <div class="card-header">
        <b>Stol ${o.stol} (#${o.raqam})</b>
        <span style="color:var(--muted)">${o.holat}</span>
      </div>
      ${o.taomlar.map(t => `<div class="item-row"><span>${t.nom}</span> <span>${t.miqdor}x</span></div>`).join('')}
      <div style="margin-top:10px; color:var(--gold)">Jami: ${o.jami_summa.toLocaleString()} so'm</div>
      ${o.holat==='yangi' ? `<button class="action-btn btn-blue" onclick="completeOrder('${o.id}')">Tayyor bo'ldi ✅</button>` : ''}
    </div>
  `).join('');
}

function completeOrder(id){
  stats.sum += orders[id].jami_summa;
  stats.count += 1;
  orders[id].holat = 'tayyor';
  document.getElementById('totalSum').innerText = stats.sum.toLocaleString();
  document.getElementById('totalOrders').innerText = stats.count;
  renderOrders();
}

function openAdmin(){
  if(prompt("Admin paroli:") === "777"){
    document.getElementById('adminPanel').style.display = 'block';
    document.getElementById('setRestName').value = settings.name;
  }
}

function closeAdmin(){ document.getElementById('adminPanel').style.display = 'none'; }

function renderMenuEdit(){
  document.getElementById('menuEditList').innerHTML = settings.menu.map((m, idx) => `
    <div class="admin-item">
      <label>${m.name} uchun rasm linki:</label>
      <input type="text" class="admin-input" value="${m.img}" onchange="settings.menu[${idx}].img = this.value">
      <label>Narxi:</label>
      <input type="number" class="admin-input" value="${m.price}" onchange="settings.menu[${idx}].price = parseInt(this.value)">
    </div>
  `).join('');
}

function saveAndBroadcast(){
  settings.name = document.getElementById('setRestName').value;
  document.getElementById('restoranNomiUI').innerText = settings.name;
  if(peer) {
    // Bu yerda ulangan barcha mijozlarga yangi menyuni yuborish kerak
    // PeerJS da buni connections massivi orqali qilamiz
    alert("Saqlandi! Mijozlar qayta kirganda yangilanadi.");
  }
}

function playAlert(){ try{ new Audio('https://www.soundjay.com/buttons/beep-01a.mp3').play(); }catch(e){} }
</script>
</body>
</html>
